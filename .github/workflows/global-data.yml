name: Build global FIRMS dataset

# One job per year downloads NASA FIRMS all-countries archives (MODIS C6.1,
# VIIRS S-NPP), aggregates every country and 1° cell, then a merge job writes
# public/data/global/{countries,grid1}.json and commits them.
on:
  workflow_dispatch:
    inputs:
      from_run:
        description: Re-merge the per-year outputs of an earlier run (run id) instead of downloading FIRMS again
        default: ""
      dataset_version:
        description: Version of the open dataset package (e.g. 1.0.0)
        default: "1.0.0"
      release:
        description: Publish the dataset zip as a GitHub release
        type: boolean
        default: false
      kaggle:
        description: Upload the dataset to Kaggle (needs KAGGLE_USERNAME and KAGGLE_KEY secrets)
        type: boolean
        default: false
      zenodo:
        description: Upload the dataset to Zenodo as a draft for review (needs ZENODO_TOKEN secret; optional ZENODO_RECORD_ID variable for a new version)
        type: boolean
        default: false
      years:
        description: JSON array of years
        default: "[2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024]"
  schedule:
    - cron: "29 4 3 1,4,7,10 *"

permissions:
  contents: write
  actions: read

jobs:
  year:
    if: ${{ !inputs.from_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        year: ${{ fromJSON(inputs.years || '[2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe archive
        continue-on-error: true
        run: |
          curl -sSI "https://firms.modaps.eosdis.nasa.gov/data/country/zips/modis_${{ matrix.year }}_all_countries.zip" | head -5
          curl -sSI "https://firms.modaps.eosdis.nasa.gov/data/country/zips/viirs-snpp_${{ matrix.year }}_all_countries.zip" | head -5
      - name: Aggregate ${{ matrix.year }}
        run: NODE_OPTIONS=--max-old-space-size=6000 npx tsx pipeline/global-year.ts ${{ matrix.year }} global-out
      - uses: actions/upload-artifact@v4
        with:
          name: global-${{ matrix.year }}
          path: global-out/global-${{ matrix.year }}.json
          retention-days: 90

  merge:
    needs: year
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: data-commit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: global-*
          path: global-out
          run-id: ${{ inputs.from_run || github.run_id }}
          github-token: ${{ github.token }}
      - run: npx tsx pipeline/global-merge.ts global-out
        env:
          DATASET_DIR: dataset-build
      - name: Commit
        run: |
          git config user.name "firecal-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Re-base the freshly built data onto the latest main without merging data files.
          rm -rf /tmp/fc-new && mkdir -p /tmp/fc-new && cp -r public/data/global /tmp/fc-new/
          git fetch origin main
          git reset --hard origin/main
          cp -r /tmp/fc-new/$(basename public/data/global) $(dirname public/data/global)/
          git add public/data/global
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -m "data: refresh global"
          git push origin HEAD:main
      # --- Open dataset: NetCDF, COG, CSV, STAC, docs ------------------------------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q xarray netCDF4 rasterio
      - name: Package dataset
        run: |
          VER="${{ inputs.dataset_version || '1.0.0' }}"
          python pipeline/export_dataset.py dataset-build dataset-out/firecal-harmonized-active-fire "$VER"
          cd dataset-out && zip -qr "firecal-harmonized-active-fire-v$VER.zip" firecal-harmonized-active-fire && ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: firecal-dataset
          path: dataset-out/*.zip
          retention-days: 90
      - name: GitHub release
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ inputs.dataset_version || '1.0.0' }}"
          gh release create "dataset-v$VER" "dataset-out/firecal-harmonized-active-fire-v$VER.zip" \
            --title "FireCal Harmonized Active Fire dataset v$VER" \
            --notes "Harmonized MODIS→VIIRS active-fire record (NASA FIRMS), monthly 1° grid and per-country tables with 90% intervals, fire energy and emissions, detection and orbit-drift analyses. See README.md and ATBD.md inside the zip. CC BY 4.0."
      - name: Kaggle
        if: ${{ inputs.kaggle }}
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          pip install -q kaggle
          python pipeline/publish_kaggle.py dataset-out/firecal-harmonized-active-fire "${{ inputs.dataset_version || '1.0.0' }}"
      - name: Zenodo (draft)
        if: ${{ inputs.zenodo }}
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_RECORD_ID: ${{ vars.ZENODO_RECORD_ID }}
          ZENODO_SANDBOX: ${{ vars.ZENODO_SANDBOX }}
        run: python pipeline/publish_zenodo.py "dataset-out/firecal-harmonized-active-fire-v${{ inputs.dataset_version || '1.0.0' }}.zip" "${{ inputs.dataset_version || '1.0.0' }}"
