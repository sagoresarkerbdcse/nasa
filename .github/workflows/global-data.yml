name: Build global FIRMS dataset

# One job per year downloads NASA FIRMS all-countries archives (MODIS C6.1,
# VIIRS S-NPP), aggregates every country and 1° cell, then a merge job writes
# public/data/global/{countries,grid1}.json and commits them.
on:
  workflow_dispatch:
    inputs:
      from_run:
        description: Re-merge the per-year outputs of an earlier run (run id) instead of downloading FIRMS again
        default: ""
      years:
        description: JSON array of years
        default: "[2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024]"
  schedule:
    - cron: "29 4 3 1,4,7,10 *"

permissions:
  contents: write
  actions: read

jobs:
  year:
    if: ${{ !inputs.from_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        year: ${{ fromJSON(inputs.years || '[2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe archive
        continue-on-error: true
        run: |
          curl -sSI "https://firms.modaps.eosdis.nasa.gov/data/country/zips/modis_${{ matrix.year }}_all_countries.zip" | head -5
          curl -sSI "https://firms.modaps.eosdis.nasa.gov/data/country/zips/viirs-snpp_${{ matrix.year }}_all_countries.zip" | head -5
      - name: Aggregate ${{ matrix.year }}
        run: NODE_OPTIONS=--max-old-space-size=6000 npx tsx pipeline/global-year.ts ${{ matrix.year }} global-out
      - uses: actions/upload-artifact@v4
        with:
          name: global-${{ matrix.year }}
          path: global-out/global-${{ matrix.year }}.json
          retention-days: 90

  merge:
    needs: year
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: data-commit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: global-*
          path: global-out
          run-id: ${{ inputs.from_run || github.run_id }}
          github-token: ${{ github.token }}
      - run: npx tsx pipeline/global-merge.ts global-out
      - name: Commit
        run: |
          git config user.name "firecal-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Re-base the freshly built data onto the latest main without merging data files.
          rm -rf /tmp/fc-new && mkdir -p /tmp/fc-new && cp -r public/data/global /tmp/fc-new/
          git fetch origin main
          git reset --hard origin/main
          cp -r /tmp/fc-new/$(basename public/data/global) $(dirname public/data/global)/
          git add public/data/global
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -m "data: refresh global"
          git push origin HEAD:main
