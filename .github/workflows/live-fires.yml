name: Refresh live FIRMS fires

# Snapshots the last 7 days of NASA FIRMS active fires (VIIRS S-NPP,
# NOAA-20, NOAA-21, MODIS) for the study area into public/data/live.json.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 2,14 * * *"

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:live
      - name: Climate index (NOAA ONI)
        continue-on-error: true
        run: npm run data:oni
      - name: Commit
        run: |
          git config user.name "firecal-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Re-base the freshly built data onto the latest main without merging data files.
          rm -rf /tmp/fc-new && mkdir -p /tmp/fc-new && cp public/data/live.json /tmp/fc-new/ && (cp public/data/oni.json /tmp/fc-new/ || true)
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/fc-new/*.json public/data/
          git add public/data/live.json public/data/oni.json 2>/dev/null || git add public/data/live.json
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -m "data: refresh live FIRMS fires and ONI"
          git push origin HEAD:main
